<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Strike - Deluxe Cyber Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0c0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            user-select: none;
        }
        canvas {
            box-shadow: 0 0 35px rgba(0, 245, 255, 0.4);
            border-radius: 10px;
            background: #0c0a1a;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="900" height="650"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Web Audio API për Zërat (Synthesizer i integruar)
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'laser') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                    gainNode.gain.setValueAtTime(0.12, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'explosion') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                    gainNode.gain.setValueAtTime(0.18, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'hit') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.15);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {
                // Parandalon gabimet e audios nëse shfletuesi bllokon
            }
        }

        // Kontrolli i Tastierës (Garantuar që kap çdo tast)
        const keys = {};

        window.addEventListener('keydown', (e) => {
            initAudio(); // Aktivizon zërin me klikimin e parë të tastit
            keys[e.code] = true;
            
            // Parandalon skrollimin e faqes me shigjeta ose hapësirë
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault();
            }

            if (e.code === 'KeyR' && gameOver) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Variablat e Lojës
        let score = 0;
        let health = 100;
        let gameOver = false;
        let shootCooldown = 0;
        let enemySpawnTimer = 0;

        // 1. Sfondi me Yje (Starfield)
        class Starfield {
            constructor() {
                this.stars = [];
                for (let i = 0; i < 120; i++) {
                    this.stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        speed: Math.random() * 3 + 0.5,
                        radius: Math.random() * 1.5 + 0.5,
                        color: Math.random() > 0.4 ? '#00f5ff' : '#646e96'
                    });
                }
            }
            updateAndDraw() {
                this.stars.forEach(star => {
                    star.x -= star.speed;
                    if (star.x < 0) {
                        star.x = canvas.width;
                        star.y = Math.random() * canvas.height;
                    }
                    ctx.fillStyle = star.color;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // 2. Sistemi i Grimcave (Particles)
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }
            emit(x, y, color, count = 8, speedRange = [1, 4]) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * (speedRange[1] - speedRange[0]) + speedRange[0];
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 3 + 2,
                        lifetime: Math.random() * 15 + 15,
                        color: color
                    });
                }
            }
            updateAndDraw() {
                this.particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.lifetime--;
                    p.size = Math.max(0.5, p.size - 0.1);

                    if (p.lifetime <= 0) {
                        this.particles.splice(index, 1);
                    } else {
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }
        }

        // 3. Avioni Lojtar (Player Jet)
        class Player {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = 100;
                this.y = canvas.height / 2;
                this.width = 45;
                this.height = 30;
                this.speed = 6.5;
            }
            handleMovement() {
                if ((keys['ArrowUp'] || keys['KeyW']) && this.y > 20) this.y -= this.speed;
                if ((keys['ArrowDown'] || keys['KeyS']) && this.y < canvas.height - this.height - 20) this.y += this.speed;
                if ((keys['ArrowLeft'] || keys['KeyA']) && this.x > 20) this.x -= this.speed;
                if ((keys['ArrowRight'] || keys['KeyD']) && this.x < canvas.width / 2) this.x += this.speed;
            }
            draw(particles) {
                // Zjarri i motorrit prapa
                particles.emit(this.x - 2, this.y + 15, '#ffdc00', 1, [2, 3]);
                particles.emit(this.x - 2, this.y + 15, '#00f5ff', 1, [1, 2]);

                // Trupi i avionit
                ctx.fillStyle = '#00f5ff';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(this.x + this.width, this.y + 15); // Hunda
                ctx.lineTo(this.x, this.y);                   // Lart
                ctx.lineTo(this.x + 10, this.y + 15);         // Qendra
                ctx.lineTo(this.x, this.y + this.height);     // Poshtë
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Kabina
                ctx.fillStyle = '#b400ff';
                ctx.beginPath();
                ctx.ellipse(this.x + 18, this.y + 10, 7, 5, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 4. Plumbat dhe Armiqtë
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 16;
                this.height = 4;
                this.speed = 12;
            }
            updateAndDraw() {
                this.x += this.speed;
                ctx.fillStyle = '#00f5ff';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x + 4, this.y + 1, 8, 2);
            }
        }

        class Enemy {
            constructor() {
                this.x = canvas.width + 30;
                this.y = Math.random() * (canvas.height - 100) + 40;
                this.width = 35;
                this.height = 25;
                this.speed = Math.random() * 4 + 4;
                this.hp = 2;
            }
            updateAndDraw() {
                this.x -= this.speed;
                ctx.fillStyle = '#ff1e5a';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y + 12);
                ctx.lineTo(this.x + this.width, this.y);
                ctx.lineTo(this.x + this.width - 8, this.y + 12);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        // Inicializimi
        const starfield = new Starfield();
        const particles = new ParticleSystem();
        const player = new Player();
        let bullets = [];
        let enemies = [];

        function resetGame() {
            score = 0;
            health = 100;
            gameOver = false;
            bullets = [];
            enemies = [];
            player.reset();
        }

        // Game Loop Kryesor
        function gameLoop() {
            ctx.fillStyle = '#0c0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            starfield.updateAndDraw();
            particles.updateAndDraw();

            if (!gameOver) {
                player.handleMovement();

                // Qitja me tastin SPACE
                shootCooldown++;
                if (keys['Space'] && shootCooldown > 10) {
                    bullets.push(new Bullet(player.x + player.width, player.y + 13));
                    playSound('laser');
                    shootCooldown = 0;
                }

                // Krijimi i armiqve
                enemySpawnTimer++;
                if (enemySpawnTimer > 35) {
                    enemies.push(new Enemy());
                    enemySpawnTimer = 0;
                }

                // Përditësimi i plumbave
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.updateAndDraw();
                    if (b.x > canvas.width) {
                        bullets.splice(i, 1);
                    }
                }

                // Përditësimi i armiqve dhe përplasjet
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let e = enemies[i];
                    e.updateAndDraw();

                    // Përplasja Plumb - Armik
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        let b = bullets[j];
                        if (b.x < e.x + e.width && b.x + b.width > e.x &&
                            b.y < e.y + e.height && b.y + b.height > e.y) {
                            e.hp--;
                            bullets.splice(j, 1);
                            particles.emit(b.x, b.y, '#00f5ff', 5);

                            if (e.hp <= 0) {
                                particles.emit(e.x + e.width / 2, e.y + e.height / 2, '#ff1e5a', 22);
                                particles.emit(e.x + e.width / 2, e.y + e.height / 2, '#ffdc00', 12);
                                enemies.splice(i, 1);
                                score += 100;
                                playSound('explosion');
                                break;
                            }
                        }
                    }

                    // Përplasja Armik - Lojtar
                    if (i < enemies.length) { // Kontrollo nëse armiku ekziston ende
                        if (player.x < e.x + e.width && player.x + player.width > e.x &&
                            player.y < e.y + e.height && player.y + player.height > e.y) {
                            particles.emit(e.x, e.y, '#ff1e5a', 15);
                            enemies.splice(i, 1);
                            health -= 25;
                            playSound('hit');
                            if (health <= 0) {
                                gameOver = true;
                            }
                        } else if (e.x < -50) {
                            enemies.splice(i, 1);
                        }
                    }
                }

                player.draw(particles);

                // UI / HUD (Pikët & Jeta)
                ctx.fillStyle = '#00f5ff';
                ctx.font = 'bold 20px "Trebuchet MS"';
                ctx.fillText(`SCORE: ${score}`, 25, 35);

                // Health Bar (Shiriti i jetës)
                ctx.fillStyle = '#323246';
                ctx.fillRect(canvas.width - 205, 20, 180, 18);
                const healthWidth = Math.max(0, (health / 100) * 180);
                ctx.fillStyle = health < 30 ? '#ff1e5a' : '#00f5ff';
                ctx.fillRect(canvas.width - 205, 20, healthWidth, 18);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(canvas.width - 205, 20, 180, 18);

            } else {
                // Ekrani Game Over
                ctx.fillStyle = '#ff1e5a';
                ctx.font = 'bold 45px "Trebuchet MS"';
                ctx.textAlign = 'center';
                ctx.fillText("MISSION FAILED", canvas.width / 2, canvas.height / 2 - 40);

                ctx.fillStyle = '#ffffff';
                ctx.font = '22px "Trebuchet MS"';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

                ctx.fillStyle = '#00f5ff';
                ctx.font = '18px "Trebuchet MS"';
                ctx.fillText("Shtyp [ R ] për të luajtur përsëri", canvas.width / 2, canvas.height / 2 + 55);
                ctx.textAlign = 'left';
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
